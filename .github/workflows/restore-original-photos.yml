name: Restore original photo quality
on:
  push:
    branches: [main]
    paths: ['assets/original/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert source photographs to high quality WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps
          src=Path('assets/original')
          names=['hOtZvQCIUno.jpg','Screenshot_2026-11-12-00-32-00-732_com.vkontakte.android.jpg','sAiJSgPPUBI-1.jpg','EFOcS_G6Ze0.jpg','Kzu_DWZ3Oz0.jpg']
          for n,name in enumerate(names,1):
            candidates=[src/name] if (src/name).is_file() else []
            if len(candidates)!=1: raise RuntimeError(f'{name}: expected one original image, found {len(candidates)}')
            with Image.open(candidates[0]) as im:
              im=ImageOps.exif_transpose(im).convert('RGB')
              if min(im.size)<600: raise RuntimeError(f'{candidates[0]} is too small: {im.size}')
              im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
              out=Path(f'assets/photo-{n}.webp')
              im.save(out,'WEBP',quality=88,method=6)
              print(out, im.size, out.stat().st_size)
          PY
      - name: Commit original-quality photos
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/photo-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore high-resolution photo gallery"
          git push
