name: Create torso-cropped family hero photo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/crop-family-photo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Crop family photo without altering original
        run: |
          python -m pip install --quiet Pillow
          python scripts/crop-family-photo.py
      - name: Commit cropped image asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/photo-1-torso.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Create real torso crop for family guitar hero photo"
          git push
